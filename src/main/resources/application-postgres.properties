# Профиль PostgreSQL. Запуск: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/toolrental
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update

# Консоль H2 с PostgreSQL не нужна
spring.h2.console.enabled=false
