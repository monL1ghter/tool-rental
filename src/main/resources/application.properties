spring.application.name=tool-rental
server.port=8080

# --- База данных: H2 в памяти (по умолчанию) ---
spring.datasource.url=jdbc:h2:mem:toolrental;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Таблицы создаются и обновляются автоматически
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Консоль H2 для просмотра таблиц: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:toolrental, пользователь sa, пароль пустой)
spring.h2.console.enabled=true

# Не создавать пользователя со случайным паролем (используем свой JWT)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Загрузка файлов (фото к отзывам)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=uploads

# --- JWT ---
# Секрет должен быть длиной не меньше 32 символов. В реальном проекте храните его в переменной окружения.
app.jwt.secret=change-this-secret-key-change-this-secret-key-1234
app.jwt.access-minutes=30
app.jwt.refresh-days=14

# Тестовый режим: OTP-код и токен сброса пароля возвращаются в ответе API
# (в реальном проекте их отправляют по SMS / email, а здесь только пишем в лог)
app.dev-mode=true
